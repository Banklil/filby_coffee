version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: filby_db
    environment:
      POSTGRES_DB: filby_admin
      POSTGRES_USER: filby
      POSTGRES_PASSWORD: filby123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filby -d filby_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: filby_backend
    environment:
      DATABASE_URL: postgresql://filby:filby123@db:5432/filby_admin
      SECRET_KEY: super-secret-key-change-in-production-at-least-32-chars
      CORS_ORIGINS: '["http://localhost:80","http://localhost:3000","http://localhost:5173"]'
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: filby_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: filby_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
